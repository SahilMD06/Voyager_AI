# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: voyager-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_API_KEY
        sync: false        # entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false        # your Vercel URL, e.g. https://voyager-ai.vercel.app
